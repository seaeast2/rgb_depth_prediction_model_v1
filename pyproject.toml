[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgb-depth-prediction"
version = "0.1.0"
description = "A simple relative depth estimator for RGB images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.3",
    "Pillow>=13.0.0",
]

[project.scripts]
rgb-depth = "rgb_depth_prediction.model:main"

[tool.setuptools.packages.find]
where = ["src"]
